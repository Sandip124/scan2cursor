[package]
name = "barcode-bridge"
version = "2.0.0"
edition = "2021"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "ws", "query", "json", "tokio"] }
base64 = "0.23.1"
enigo = "0.6.1"
futures-util = "0.3.34"
getrandom = "0.4.3"
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio", "service"] }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rcgen = "0.14.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
time = { version = "0.3.55", features = ["formatting"] }
tokio = { version = "1.54.1", features = ["rt", "net", "macros", "sync", "time", "io-util", "process", "signal"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
