<!doctype html>
<meta charset="utf-8">
<title>Scan2Cursor Scanner</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111111">
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="manifest" id="manifest" href="/manifest.webmanifest">
<script>
  // "Add to Home Screen": the installed app opens this scanner link (with its pairing code).
  document.getElementById('manifest').href = '/manifest.webmanifest?t=' + encodeURIComponent(new URLSearchParams(location.search).get('t') || '');
</script>
<style>
  html,body{height:100%}
  body{margin:0;font:16px system-ui;background:#111;color:#fff;display:flex;flex-direction:column}
  #top{padding:calc(.6rem + env(safe-area-inset-top)) 1rem .6rem;display:flex;align-items:center;gap:.5rem;font-size:.9rem;color:#aaa}
  #logo{width:32px;height:32px;border-radius:8px;margin-right:.2rem}
  #dot{width:10px;height:10px;border-radius:50%;background:#e44;flex:none}
  #dot.ok{background:#3d6}
  /* How this phone reaches the computer: Wi-Fi or internet tunnel. Icon only. */
  #q{color:#fc3;font-weight:600;white-space:nowrap}
  #via{margin-left:auto;display:flex;flex:none}
  #hold{margin:0 1rem .6rem;padding:.7rem .8rem;background:#3a2f00;color:#ffe08a;border-radius:12px;font-size:.95rem}
  #hold[hidden]{display:none}
  #hold .actions{display:flex;gap:.5rem;margin-top:.6rem}
  #hold button{flex:1;padding:.6rem;font:inherit;font-weight:600;border:0;border-radius:10px}
  #send{background:#fc3;color:#000}
  #discard{background:#5a4a10;color:#ffe08a}
  #send[hidden]{display:none}
  #via svg{width:22px;height:22px}
  #nm{background:none;border:1px solid #444;border-radius:8px;color:#ddd;font:inherit;padding:.25rem .6rem;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* Camera view with the scan strip: only the strip is decoded (faster, fewer wrong reads). */
  #reader{position:relative;width:100%;height:46vh;background:#000;overflow:hidden}
  #cam{width:100%;height:100%;object-fit:cover;display:block}
  #strip{position:absolute;left:7%;width:86%;top:34%;height:32%;border:2px solid rgba(255,255,255,.85);border-radius:12px;box-shadow:0 0 0 100vmax rgba(0,0,0,.35);pointer-events:none}
  #reader.armed #strip{border-color:#fc3}
  #camctl{position:absolute;right:.6rem;bottom:.6rem;display:flex;gap:.4rem}
  #camctl button{min-width:2.6rem;padding:.45rem .6rem;font:inherit;font-size:.9rem;font-weight:600;color:#fff;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.35);border-radius:999px}
  #camctl button.on{background:#fff;color:#000}
  #zoom{display:flex;gap:.3rem}
  #camctl [hidden]{display:none}
  #camhint{position:absolute;inset:0;display:grid;place-items:center;color:#aaa;font-size:.95rem;text-align:center;padding:1rem}
  #last{flex:1;display:flex;align-items:center;justify-content:center;padding:.5rem 1rem;font:1.3rem ui-monospace,monospace;word-break:break-all;text-align:center}
  /* Raised from the bottom edge so the thumb reaches it comfortably while holding the phone. */
  #scan{margin:0 1rem calc(14vh + env(safe-area-inset-bottom));padding:1.7rem 1.4rem;font-size:1.5rem;font-weight:600;border:0;border-radius:18px;background:#3d6;color:#000;touch-action:manipulation}
  #scan.armed{background:#fc3}
</style>
<div id="top"><img id="logo" src="/logo.svg" alt="Scan2Cursor"><span id="dot"></span><span id="st">connecting…</span><span id="q" hidden></span><span id="via" role="img"></span><button id="nm" title="Rename this phone"></button></div>
<div id="hold" hidden><span id="holdtext"></span><span class="actions"><button id="send">Send now</button><button id="discard">Discard</button></span></div>
<div id="reader">
  <video id="cam" playsinline muted></video>
  <div id="camhint">Tap SCAN to start the camera</div>
  <div id="strip"></div>
  <div id="camctl"><span id="zoom" hidden></span><button id="torch" hidden aria-label="Torch">🔦</button></div>
</div>
<div id="last"></div>
<button id="scan">SCAN</button>
<script>
// Works like a handheld scanner trigger: tap SCAN, the next barcode inside the box is read once, sent, and typed + Enter on the desktop.
const t = new URLSearchParams(location.search).get('t') || '';
const $ = id => document.getElementById(id);
let ws, actx, armed = false, armTimer;

function tone(freq, ms, type = 'sine', vol = 0.4, at = 0) {
  if (!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.value = freq; g.gain.value = vol;
  o.connect(g); g.connect(actx.destination);
  o.start(actx.currentTime + at); o.stop(actx.currentTime + at + ms / 1000);
}
const beepOk = () => tone(2000, 120);
const beepErr = () => { tone(220, 180, 'square', 0.3); tone(220, 180, 'square', 0.3, 0.25); };
const tick = () => tone(900, 40, 'sine', 0.25); // "saved, will go through"
const buzz = p => navigator.vibrate && navigator.vibrate(p);

// Connection type icon: a plain network address means the same Wi-Fi; a host name means the internet tunnel.
const viaWifi = /^(\d{1,3}\.){3}\d{1,3}$|^localhost$|^\[/.test(location.hostname);
$('via').innerHTML = viaWifi
  ? '<svg viewBox="0 0 24 24" fill="none" stroke="#ddd" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M2.5 9.2a14 14 0 0 1 19 0"/><path d="M5.8 12.7a9 9 0 0 1 12.4 0"/><path d="M9 16.1a4.5 4.5 0 0 1 6 0"/><circle cx="12" cy="19.4" r="1.4" fill="#ddd" stroke="none"/></svg>'
  : '<svg viewBox="0 0 24 24" fill="#ddd" aria-hidden="true"><path d="M7 19h10.5a4.5 4.5 0 0 0 .7-8.95A6.5 6.5 0 0 0 5.6 9.3 4.9 4.9 0 0 0 7 19z"/></svg>';
$('via').setAttribute('aria-label', viaWifi ? 'Connected over Wi-Fi' : 'Connected over the internet');
$('via').title = viaWifi ? 'Connected over Wi-Fi' : 'Connected over the internet';

let online = false, desktops = 0, unpaired = false;
function showStatus() {
  const ok = online && desktops > 0;
  $('dot').className = ok ? 'ok' : '';
  $('st').textContent = unpaired ? 'not paired' : !online ? 'offline' : desktops ? 'ready' : 'computer cannot type yet';
}
// This phone's own key, given by the computer when it was paired. The QR code's token (t) is only
// needed for that first pairing.
let myKey = '';
try { myKey = localStorage.getItem('bbKey') || ''; } catch {}
// Name shown in the desktop's device list. Empty = the server picks one (e.g. "iPhone · Safari").
let myName = '';
try { myName = localStorage.getItem('bbName') || ''; } catch {}
$('nm').onclick = () => {
  const n = prompt('Name for this phone (shown on the desktop)', $('nm').textContent);
  if (n === null) return;
  myName = n.trim().slice(0, 40);
  try { localStorage.setItem('bbName', myName); } catch {}
  if (ws) ws.close(); // reconnects with the new name
};

// ---------- Waiting scans ----------
// Every scan is saved here first and stays until the computer confirms it was typed (or received by a
// bridge.js page). Saved in browser storage, so a reload, a locked screen or a closed browser loses nothing.
const MAX_WAITING = 500;           // more than this: new scans are refused
const AUTO_SEND_MS = 2 * 60 * 1000; // older waiting scans are only sent after the worker taps "Send now"
const RETRY_MS = 2000;             // computer reachable but cannot type yet: try again after this
const load = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
let queue = load('s2cQueue', []);   // [{id, code, format, at}] in scan order
let seq = load('s2cSeq', 0);        // scan numbers, unique per phone
let hold = load('s2cHold', false);  // waiting scans need the worker's OK before they are sent
let inFlight = 0;                   // queue[0 .. inFlight-1] are sent on this connection, not yet confirmed
let paused = false, retryTimer = null;
let approvedUpTo = 0;               // scans up to this id were approved with "Send now", whatever their age
const feedback = new Map();         // scan id -> { timer, saidWaiting }
const saveQueue = () => save('s2cQueue', queue);
function setHold(v) { hold = v; save('s2cHold', v); showQueue(); }

function showQueue() {
  const n = queue.length;
  $('q').textContent = n ? `${n} waiting` : '';
  $('q').hidden = !n;
  const bar = $('hold');
  if (!n || (!hold && !unpaired)) { bar.hidden = true; return; }
  bar.hidden = false;
  const since = new Date(queue[0].at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  $('holdtext').textContent = unpaired
    ? `${n} scan${n === 1 ? '' : 's'} not sent. Scan the QR code on the computer again to connect.`
    : `${n} scan${n === 1 ? '' : 's'} waiting since ${since}. Click into the right field on the computer, then send.`;
  $('send').hidden = unpaired;
}
$('send').onclick = () => { approvedUpTo = queue.length ? queue[queue.length - 1].id : 0; setHold(false); pump(); };
$('discard').onclick = () => {
  if (!confirm(`Discard ${queue.length} waiting scan${queue.length === 1 ? '' : 's'}? They will not be typed.`)) return;
  queue = []; inFlight = 0; saveQueue(); setHold(false);
};

// Send everything not yet in flight, in order, without waiting for confirmations.
function pump() {
  if (!ws || ws.readyState !== 1 || unpaired || hold || paused) return;
  if (inFlight === 0 && queue.length && queue[0].id > approvedUpTo && Date.now() - queue[0].at > AUTO_SEND_MS) return setHold(true);
  while (inFlight < queue.length) ws.send(JSON.stringify({ type: 'scan', ...queue[inFlight++] }));
}

function addScan(code, format) {
  if (queue.length >= MAX_WAITING) {
    beepErr(); buzz([200, 100, 200]);
    $('last').textContent = `✗ ${MAX_WAITING} scans already waiting. Reconnect to the computer first.`;
    return;
  }
  const s = { id: ++seq, code, format, at: Date.now() };
  save('s2cSeq', seq);
  queue.push(s); saveQueue();
  $('last').textContent = '⏳ ' + code;
  // Not confirmed quickly (offline, slow network, or computer cannot type yet): say "saved" once.
  const fb = { saidWaiting: false, timer: null };
  const sayWaiting = () => { if (!fb.saidWaiting && queue.some(x => x.id === s.id)) { fb.saidWaiting = true; tick(); buzz(30); } showQueue(); };
  feedback.set(s.id, fb);
  if (!ws || ws.readyState !== 1 || hold || unpaired) sayWaiting();
  else fb.timer = setTimeout(sayWaiting, 800);
  showQueue();
  pump();
}

function onAck(m) {
  const fb = feedback.get(m.id);
  if (m.delivered || m.rejected) {
    const i = queue.findIndex(x => x.id === m.id);
    if (i >= 0) { queue.splice(i, 1); if (i < inFlight) inFlight--; saveQueue(); }
    if (fb) { clearTimeout(fb.timer); feedback.delete(m.id); }
    if (m.rejected) { beepErr(); buzz([200, 100, 200]); $('last').textContent = '✗ not a valid code: ' + m.code; }
    else if (!fb || !fb.saidWaiting) { beepOk(); buzz(80); $('last').textContent = '✓ ' + m.code; } // later deliveries are silent
    return showQueue();
  }
  // Reachable but not typed (e.g. typing not allowed yet): stop, then resend from the oldest, in order.
  if (fb && !fb.saidWaiting) { clearTimeout(fb.timer); fb.saidWaiting = true; tick(); buzz(30); }
  paused = true; inFlight = 0;
  if (!retryTimer) retryTimer = setTimeout(() => { retryTimer = null; paused = false; pump(); }, RETRY_MS);
  showQueue();
}

// ---------- Connection ----------
let reconnectTimer = null;
function connect() {
  clearTimeout(reconnectTimer);
  const name = myName ? '&name=' + encodeURIComponent(myName) : '';
  const key = myKey ? '&k=' + encodeURIComponent(myKey) : '';
  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws?role=phone&t=${encodeURIComponent(t)}${key}${name}`);
  ws.onopen = () => { online = true; inFlight = 0; paused = false; showStatus(); pump(); };
  ws.onclose = e => {
    online = false; inFlight = 0;
    // 4403: removed on the computer. 4401: key unknown and the QR code has changed since.
    if (e.code === 4403 || e.code === 4401) {
      unpaired = true; myKey = '';
      try { localStorage.removeItem('bbKey'); } catch {}
      if (queue.length) setHold(true); // after pairing again, the worker decides: send or discard
      $('last').textContent = (e.code === 4403 ? 'This phone was removed on the computer.' : 'This phone is not paired with the computer.')
        + ' Scan the QR code on the computer again to connect.';
      showQueue();
      return showStatus(); // do not keep retrying
    }
    showStatus(); reconnectTimer = setTimeout(connect, 1000);
  };
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === 'hello') {
      $('nm').textContent = m.name;
      if (m.key) { myKey = m.key; try { localStorage.setItem('bbKey', myKey); } catch {} }
    }
    if (m.type === 'status') { desktops = m.desktops; showStatus(); }
    if (m.type === 'ack') onAck(m);
  };
}
// Reconnect at once when the screen comes back on or the network returns, instead of waiting.
function reconnectNow() { if (!unpaired && (!ws || ws.readyState > 1)) connect(); }
window.addEventListener('online', reconnectNow);

// Keep the screen awake while this page is open and in front: a sleeping screen drops the connection.
let wakeLock = null;
async function keepAwake() {
  if (wakeLock || document.visibilityState !== 'visible' || !('wakeLock' in navigator)) return;
  try { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } catch {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { keepAwake(); reconnectNow(); } });
keepAwake();
showQueue();
connect();

// ---------- Camera ----------
// Own camera handling: 1080p for thin 1D bars, continuous focus, torch and zoom where the phone allows,
// and decoding in a background worker (scan-worker.js), only while armed.
const video = $('cam');
let stream = null, track = null, caps = {}, worker = null, busy = false, candidate = '', scanEngine = '';
const isIPhone = /iPhone/.test(navigator.userAgent);

async function startCamera() {
  stream = await navigator.mediaDevices.getUserMedia({
    audio: false,
    video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
  });
  track = stream.getVideoTracks()[0];
  video.srcObject = stream;
  await video.play();
  $('camhint').hidden = true;
  caps = (track.getCapabilities && track.getCapabilities()) || {};
  if ((caps.focusMode || []).includes('continuous')) track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {});
  setupControls();
  if (!worker) {
    const engineParam = new URLSearchParams(location.search).get('engine') === 'zxing' ? '?engine=zxing' : '';
    worker = new Worker('/scan-worker.js' + engineParam);
    worker.onmessage = onFrameResult;
    worker.onerror = () => { busy = false; $('last').textContent = 'Scanner failed to load. Reload the page.'; };
  }
}

// Torch and zoom buttons only appear when this phone's browser supports them.
function setupControls() {
  $('torch').hidden = !caps.torch;
  const box = $('zoom'), z = caps.zoom;
  box.replaceChildren();
  const levels = z ? [1, 2, 3].filter(l => l >= z.min && l <= z.max) : [];
  box.hidden = levels.length < 2;
  if (box.hidden) return;
  for (const l of levels) {
    const b = document.createElement('button');
    b.textContent = l + '×'; b.dataset.level = l;
    b.onclick = () => setZoom(l);
    box.append(b);
  }
  // iPhone Pro main cameras cannot focus closer than about 9 cm: start at 2x, so the phone is held
  // farther away, where it can focus, and the code still fills the strip.
  setZoom(isIPhone && levels.includes(2) ? 2 : levels[0]);
}
function setZoom(level) {
  track.applyConstraints({ advanced: [{ zoom: level }] }).catch(() => {});
  for (const b of $('zoom').children) b.classList.toggle('on', +b.dataset.level === level);
}
let torchOn = false;
$('torch').onclick = async () => {
  torchOn = !torchOn;
  try { await track.applyConstraints({ advanced: [{ torch: torchOn }] }); } catch { torchOn = false; }
  $('torch').classList.toggle('on', torchOn);
};
// Tap to focus (Android browsers that support it); goes back to continuous focus after.
video.addEventListener('click', e => {
  if (!track || !(caps.focusMode || []).includes('single-shot')) return;
  const r = video.getBoundingClientRect();
  const point = { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height };
  track.applyConstraints({ advanced: [{ pointsOfInterest: [point], focusMode: 'single-shot' }] })
    .then(() => setTimeout(() => track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {}), 1500))
    .catch(() => {});
});

// The scan strip on screen, in camera pixels (the video is shown cropped to fill its box).
function stripInVideo() {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh) return null;
  const ew = video.clientWidth, eh = video.clientHeight, s = $('strip');
  const scale = Math.max(ew / vw, eh / vh);
  const offX = (vw * scale - ew) / 2, offY = (vh * scale - eh) / 2;
  const x = Math.max(0, Math.round((s.offsetLeft + offX) / scale)), y = Math.max(0, Math.round((s.offsetTop + offY) / scale));
  return { x, y, w: Math.min(vw - x, Math.round(s.offsetWidth / scale)), h: Math.min(vh - y, Math.round(s.offsetHeight / scale)) };
}

function nextFrame() {
  if (!armed) return;
  if (video.requestVideoFrameCallback) video.requestVideoFrameCallback(grab);
  else setTimeout(grab, 40);
}
async function grab() {
  if (!armed) return;
  if (busy) return nextFrame(); // still decoding the previous frame: skip this one
  const r = stripInVideo();
  if (!r || r.w < 16 || r.h < 16) return nextFrame();
  busy = true;
  try {
    const frame = await createImageBitmap(video, r.x, r.y, r.w, r.h);
    worker.postMessage({ frame }, [frame]);
  } catch { busy = false; }
  nextFrame();
}
function onFrameResult(e) {
  busy = false;
  const { codes } = e.data;
  scanEngine = e.data.engine || scanEngine; // which decoder is in use, for troubleshooting
  if (!armed || !codes || !codes.length) return;
  const c = codes[0];
  // Accept a code only after two matching reads: a single blurry frame can misread a 1D barcode.
  if (c.code !== candidate) { candidate = c.code; return; }
  candidate = '';
  disarm();
  addScan(c.code, c.format);
}

function disarm() {
  armed = false; clearTimeout(armTimer);
  $('scan').className = ''; $('scan').textContent = 'SCAN'; $('reader').classList.remove('armed');
}
function arm() {
  armed = true; candidate = '';
  $('scan').className = 'armed'; $('scan').textContent = 'Scanning…'; $('reader').classList.add('armed'); $('last').textContent = '';
  clearTimeout(armTimer); armTimer = setTimeout(disarm, 8000);
  nextFrame();
}
// The browser stops the camera when the page goes to the background; it restarts on the next tap.
document.addEventListener('visibilitychange', () => { if (document.visibilityState !== 'visible') disarm(); });

$('scan').onclick = async () => {
  if (armed) return disarm();
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  actx.resume();
  keepAwake();
  if (!track || track.readyState === 'ended') {
    $('scan').disabled = true; $('last').textContent = 'Starting camera…';
    try { await startCamera(); $('last').textContent = ''; }
    catch (err) { $('last').textContent = 'Camera error: ' + (err && err.message ? err.message : err); return; }
    finally { $('scan').disabled = false; }
  }
  arm();
};
</script>
