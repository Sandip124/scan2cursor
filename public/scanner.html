<!doctype html>
<meta charset="utf-8">
<title>Scanner</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111111">
<style>
  html,body{height:100%}
  body{margin:0;font:16px system-ui;background:#111;color:#fff;display:flex;flex-direction:column}
  #top{padding:.7rem 1rem;display:flex;align-items:center;gap:.5rem;font-size:.9rem;color:#aaa}
  #dot{width:10px;height:10px;border-radius:50%;background:#e44}
  #dot.ok{background:#3d6}
  #nm{margin-left:auto;background:none;border:1px solid #444;border-radius:8px;color:#ddd;font:inherit;padding:.25rem .6rem;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #reader{width:100%}
  #last{flex:1;display:flex;align-items:center;justify-content:center;padding:.5rem 1rem;font:1.3rem ui-monospace,monospace;word-break:break-all;text-align:center}
  #scan{margin:0 1rem calc(1rem + env(safe-area-inset-bottom));padding:1.4rem;font-size:1.4rem;font-weight:600;border:0;border-radius:16px;background:#3d6;color:#000;touch-action:manipulation}
  #scan.armed{background:#fc3}
</style>
<div id="top"><span id="dot"></span><span id="st">connecting…</span><button id="nm" title="Rename this phone"></button></div>
<div id="reader"></div>
<div id="last"></div>
<button id="scan">SCAN</button>
<script src="/vendor/html5-qrcode.js"></script>
<script>
// Works like a handheld scanner trigger: tap SCAN, the next barcode inside the box is read once, sent, and typed + Enter on the desktop.
const t = new URLSearchParams(location.search).get('t') || '';
const $ = id => document.getElementById(id);
let ws, actx, started = false, armed = false, armTimer;

function tone(freq, ms, type = 'sine', vol = 0.4, at = 0) {
  if (!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.value = freq; g.gain.value = vol;
  o.connect(g); g.connect(actx.destination);
  o.start(actx.currentTime + at); o.stop(actx.currentTime + at + ms / 1000);
}
const beepOk = () => tone(2000, 120);
const beepErr = () => { tone(220, 180, 'square', 0.3); tone(220, 180, 'square', 0.3, 0.25); };
const buzz = p => navigator.vibrate && navigator.vibrate(p);

let online = false, desktops = 0;
function showStatus() {
  const ok = online && desktops > 0;
  $('dot').className = ok ? 'ok' : '';
  $('st').textContent = !online ? 'offline' : desktops ? 'ready' : 'computer cannot type yet';
}
// Name shown in the desktop's device list. Empty = the server picks one (e.g. "iPhone · Safari").
let myName = '';
try { myName = localStorage.getItem('bbName') || ''; } catch {}
$('nm').onclick = () => {
  const n = prompt('Name for this phone (shown on the desktop)', $('nm').textContent);
  if (n === null) return;
  myName = n.trim().slice(0, 40);
  try { localStorage.setItem('bbName', myName); } catch {}
  ws.close(); // reconnects with the new name
};
function connect() {
  const name = myName ? '&name=' + encodeURIComponent(myName) : '';
  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws?role=phone&t=${encodeURIComponent(t)}${name}`);
  ws.onopen = () => { online = true; showStatus(); };
  ws.onclose = () => { online = false; showStatus(); setTimeout(connect, 1000); };
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === 'hello') $('nm').textContent = m.name;
    if (m.type === 'status') { desktops = m.desktops; showStatus(); }
    if (m.type === 'ack') {
      if (m.delivered) { beepOk(); buzz(80); $('last').textContent = '✓ ' + m.code; }
      else { beepErr(); buzz([200, 100, 200]); $('last').textContent = '✗ not typed: check the computer'; }
    }
  };
}
connect();

function disarm() { armed = false; clearTimeout(armTimer); $('scan').className = ''; $('scan').textContent = 'SCAN'; }
function arm() {
  armed = true; $('scan').className = 'armed'; $('scan').textContent = 'Scanning…'; $('last').textContent = '';
  clearTimeout(armTimer); armTimer = setTimeout(disarm, 8000);
}
function onDecode(code, result) {
  if (!armed) return;
  disarm();
  if (ws.readyState !== 1) { beepErr(); $('last').textContent = '✗ offline'; return; }
  ws.send(JSON.stringify({ type: 'scan', code, format: result?.result?.format?.formatName }));
}

$('scan').onclick = async () => {
  if (armed) return disarm();
  if (!started) {
    started = true;
    actx = new (window.AudioContext || window.webkitAudioContext)();
    const F = Html5QrcodeSupportedFormats;
    const scanner = new Html5Qrcode('reader', {
      formatsToSupport: [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128, F.CODE_39, F.ITF, F.CODE_93, F.QR_CODE, F.DATA_MATRIX],
      useBarCodeDetectorIfSupported: true, verbose: false,
    });
    try {
      await scanner.start({ facingMode: 'environment' },
        { fps: 10, qrbox: (w, h) => ({ width: Math.floor(w * 0.7), height: Math.max(60, Math.floor(Math.min(h, w) * 0.22)) }) },
        onDecode, () => {});
    } catch (err) { started = false; $('last').textContent = 'Camera error: ' + err; return; }
  }
  actx.resume();
  arm();
};
</script>
