<!doctype html>
<meta charset="utf-8">
<title>Scan2Cursor</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<style>
  body{font:16px system-ui;max-width:420px;margin:3rem auto;padding:0 1rem;text-align:center;color:#222}
  .logo{display:block;margin:0 auto .6rem;border-radius:14px}
  h1{font-size:1.4rem;margin:0 0 .3rem}
  h2{font-size:1rem;margin:1.6rem 0 .2rem;text-align:left}
  .tabs{display:flex;gap:.3rem;margin:1.2rem 0 0;padding:.25rem;background:#f0f0f0;border-radius:10px}
  .tabs button{flex:1;padding:.55rem .4rem;font:inherit;font-weight:600;color:#555;background:none;border:0;border-radius:8px;cursor:pointer}
  .tabs button[aria-selected=true]{background:#fff;color:#111;box-shadow:0 1px 3px rgba(0,0,0,.15)}
  .tabs button:focus-visible{outline:2px solid #06c;outline-offset:1px}
  .qr{margin:.4rem 0;min-height:17.5rem}
  .qr .img{position:relative;width:260px;margin:.6rem auto 0}
  .qr img{display:block;border-radius:12px}
  /* Icon in the middle of the QR code. Kept small (about a fifth of the width) and the code uses the
     highest error correction, so it still scans. */
  .qr .badge{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;display:grid;place-items:center;background:#fff;border-radius:12px}
  .qr .badge svg{width:38px;height:38px}
  .qr .note{display:block;margin-top:.3rem}
  code{background:#f2f2f2;border-radius:4px;padding:.1rem .3rem}
  #blocked{display:block;margin:.8rem 0;padding:.7rem .8rem;text-align:left;color:#7a1f14;background:#fdecea;border-radius:8px}
  #blocked[hidden]{display:none}
  #devices{list-style:none;margin:0;padding:0;text-align:left}
  #devices li{display:flex;gap:.6rem;align-items:baseline;padding:.6rem .2rem;border-top:1px solid #eee}
  #devices .name{font-weight:600;flex:1;min-width:0;overflow-wrap:anywhere}
  #devices .meta{color:#777;font-size:.85rem;text-align:right;white-space:pre}
  #devices .empty{color:#777;justify-content:center}
  #devices .offline .name{color:#777;font-weight:500}
  #devices button{align-self:center;padding:.3rem .6rem;font:inherit;font-size:.85rem;color:#b3261e;background:#fff;border:1px solid #e3b5b1;border-radius:8px;cursor:pointer}
  #devices button:hover{background:#fdecea}
  .linkbtn{margin:.4rem 0;padding:.3rem;font:inherit;font-size:.9rem;color:#06c;background:none;border:0;cursor:pointer}
  small{color:#777}
</style>
<img class="logo" src="/logo.svg" width="64" height="64" alt="">
<h1>Scan2Cursor</h1>
<div class="tabs" role="tablist" aria-label="How the phone connects">
  <button role="tab" id="tab-lan" aria-controls="lan" aria-selected="true">Same Wi-Fi</button>
  <button role="tab" id="tab-net" aria-controls="net" aria-selected="false">From anywhere</button>
</div>
<div class="qr" id="lan" role="tabpanel" aria-labelledby="tab-lan"><div class="img"></div></div>
<div class="qr" id="net" role="tabpanel" aria-labelledby="tab-net" hidden><div class="img"></div><small class="note"></small></div>
<small id="blocked" role="alert" hidden>Scans cannot be typed yet: this computer has not allowed it. On a Mac: System Settings → Privacy &amp; Security → Accessibility → switch on <b>Scan2Cursor</b>. It starts working by itself within a few seconds.</small>
<h2>Devices (<span id="count">0 connected</span>)</h2>
<ul id="devices"><li class="empty">No phones paired yet</li></ul>
<button id="offline" class="linkbtn" hidden></button>
<script>
// Tabs: one QR code at a time. The last choice is remembered.
const tabs = [...document.querySelectorAll('.tabs [role=tab]')];
function selectTab(id) {
  const tab = tabs.find(t => t.getAttribute('aria-controls') === id) || tabs[0];
  tabs.forEach(t => { const on = t === tab; t.setAttribute('aria-selected', on); t.tabIndex = on ? 0 : -1;
    document.getElementById(t.getAttribute('aria-controls')).hidden = !on; });
  try { localStorage.setItem('bbTab', tab.getAttribute('aria-controls')); } catch {}
}
tabs.forEach((t, i) => {
  t.onclick = () => selectTab(t.getAttribute('aria-controls'));
  t.onkeydown = e => { if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    const n = tabs[(i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length]; n.focus(); n.click(); };
});
let savedTab = 'lan'; try { savedTab = localStorage.getItem('bbTab') || 'lan'; } catch {}
selectTab(location.hash.slice(1) || savedTab);   // http://localhost:8443/#net opens the internet tab

(async () => {
  let tok = localStorage.getItem('bbToken') || '';
  let res = await fetch('/api/pair?t=' + encodeURIComponent(tok));
  if (res.status === 401) {
    tok = prompt('Token') || ''; localStorage.setItem('bbToken', tok);
    res = await fetch('/api/pair?t=' + encodeURIComponent(tok));
  }
  let p = await res.json();
  // Icons shown in the middle of each QR code: Wi-Fi for the local code, a cloud for the internet one.
  const ICONS = {
    wifi: '<svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M2.5 9.2a14 14 0 0 1 19 0"/><path d="M5.8 12.7a9 9 0 0 1 12.4 0"/><path d="M9 16.1a4.5 4.5 0 0 1 6 0"/><circle cx="12" cy="19.4" r="1.4" fill="#111" stroke="none"/></svg>',
    cloud: '<svg viewBox="0 0 24 24" fill="#111" aria-hidden="true"><path d="M7 19h10.5a4.5 4.5 0 0 0 .7-8.95A6.5 6.5 0 0 0 5.6 9.3 4.9 4.9 0 0 0 7 19z"/></svg>',
  };
  const qrImg = (box, src, alt, icon) => {
    const i = new Image(260, 260); i.src = src; i.alt = alt;
    const b = document.createElement('span'); b.className = 'badge'; b.innerHTML = ICONS[icon];
    box.replaceChildren(i, b);
  };
  function showPair() {
    qrImg(document.querySelector('#lan .img'), p.qr, 'QR code for phones on the same Wi-Fi', 'wifi');
    const box = document.querySelector('#net .img'), note = document.querySelector('#net .note'), t = p.tunnel || {};
    if (t.qr) { qrImg(box, t.qr, 'QR code for phones on any network', 'cloud'); note.textContent = ''; }
    else if (t.enabled) { box.replaceChildren(); note.textContent = 'Connecting to the internet…'; }
    else { box.replaceChildren(); note.innerHTML = 'Off. To allow it, run <code>scan2cursor tunnel on</code> on this computer.'; }
  }
  showPair();
  // The internet address arrives a few seconds after start, and changes if the tunnel restarts.
  const reloadPair = async () => { const r = await fetch('/api/pair?t=' + encodeURIComponent(p.token)); if (r.ok) { p = await r.json(); showPair(); } };

  const ago = ms => { const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
    return s < 60 ? `${s}s ago` : s < 3600 ? `${Math.floor(s / 60)} min ago` : `${Math.floor(s / 3600)} h ago`; };
  let devices = [];
  // Names come from the phones: build with textContent only, never innerHTML.
  const el = (tag, cls, text) => { const e = document.createElement(tag); e.className = cls; e.textContent = text; return e; };
  let ws;
  function removeDevice(d) {
    if (!confirm(`Remove "${d.name}"?\n\nIt is disconnected and can no longer scan. To use it again, scan the QR code with it.\nThe QR code changes; your other phones keep working.`)) return;
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'remove', id: d.id }));
  }
  // Offline phones stay paired (they reconnect by themselves) but are hidden unless asked for.
  let showOffline = false;
  const offBtn = document.getElementById('offline');
  offBtn.onclick = () => { showOffline = !showOffline; render(); };
  function render() {
    const ul = document.getElementById('devices');
    const online = devices.filter(d => d.online).length, offline = devices.length - online;
    document.getElementById('count').textContent = `${online} connected`;
    offBtn.hidden = !offline;
    offBtn.textContent = showOffline ? `Hide ${offline} offline` : `Show ${offline} offline`;
    const shown = devices.filter(d => d.online || showOffline);
    if (!shown.length) return ul.replaceChildren(el('li', 'empty', devices.length ? 'No phones connected right now' : 'No phones paired yet'));
    ul.replaceChildren(...shown.map(d => {
      const li = document.createElement('li');
      if (!d.online) li.className = 'offline';
      const scans = `${d.scans} scan${d.scans === 1 ? '' : 's'}${d.lastScan ? ', last ' + ago(d.lastScan) : ''}`;
      const meta = d.online ? `${d.ip} · connected ${ago(d.since)}\n${scans}` : `offline\nlast seen ${ago(d.lastSeen)}`;
      li.append(el('span', 'name', `${d.kind === 'phone' ? '📱' : '🖥'} ${d.name}`), el('span', 'meta', meta));
      if (d.removable) {
        const b = el('button', '', 'Remove');
        b.setAttribute('aria-label', `Remove ${d.name}`);
        b.onclick = () => removeDevice(d);
        li.append(b);
      }
      return li;
    }));
  }
  setInterval(render, 10000); // keep the "ago" times fresh

  const open = () => {
    ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws?role=monitor&t=${encodeURIComponent(p.token)}`);
    ws.onmessage = e => { const m = JSON.parse(e.data); if (m.type === 'pair') return reloadPair(); if (m.type !== 'status') return;
      document.getElementById('blocked').hidden = m.typers > 0; devices = m.devices || []; render(); };
    ws.onclose = () => { devices = []; render(); setTimeout(() => { reloadPair(); open(); }, 1500); };
  };
  open();
})();
</script>
